app:
  secret_key: "your-secret-key-here"
  debug: true
  session_lifetime_hours: 8  # Session expires after 8 hours of inactivity

# Server configuration
server:
  type: "production"  # Options: 'development' or 'production'
  host: "0.0.0.0"
  port: 5000
  threads: 4           # Number of threads for production server (Waitress)

# Search configuration
search:
  default_limit: 25  # Default number of URLs to return in search results

# Tokenizer configuration
tokenizer:
  type: janome  # Options: 'janome', 'mecab', or null for auto-detect (tries MeCab first, falls back to Janome)

# Multi-index configuration - users must select a prefecture
