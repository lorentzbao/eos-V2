app:
  secret_key: "your-secret-key-here"
  debug: true

# Server configuration
server:
  type: "development"  # Options: 'development' or 'production'
  host: "0.0.0.0"
  port: 5000
  threads: 4           # Number of threads for production server (Waitress)

# Search configuration
search:
  default_limit: 50  # Default number of URLs to return in search results

# Tokenizer configuration
tokenizer:
  type: janome  # Options: 'janome', 'mecab', or null for auto-detect (tries MeCab first, falls back to Janome)

# Multi-index configuration - users must select a prefecture
indexes:
  tokyo:
    dir: "data/indexes/tokyo"
    name: "Tokyo"
  osaka:
    dir: "data/indexes/osaka"
    name: "Osaka"
  kochi:
    dir: "data/indexes/kochi"
    name: "Kochi"
  oita:
    dir: "data/indexes/oita"
    name: "Oita"
  tochigi:
    dir: "data/indexes/tochigi"
    name: "Tochigi"